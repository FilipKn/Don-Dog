name: Deploy child theme to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-don-dog-theme
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload theme to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key and known_hosts
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_PRIVATE_KEY_B64: ${{ secrets.CPANEL_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          [ -n "$CPANEL_HOST" ] || { echo "::error::CPANEL_HOST secret is empty"; exit 1; }
          [ -n "$CPANEL_PORT" ] || { echo "::error::CPANEL_PORT secret is empty"; exit 1; }
          [ -n "$CPANEL_SSH_PRIVATE_KEY_B64" ] || { echo "::error::CPANEL_SSH_PRIVATE_KEY_B64 secret is empty"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if printf '%s' "$CPANEL_SSH_PRIVATE_KEY_B64" | tr -d '\r' | base64 -d > ~/.ssh/id_ed25519 2>/dev/null; then
            echo "SSH key decoded from base64 secret."
          else
            printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY_B64" | tr -d '\r' > ~/.ssh/id_ed25519
            echo "SSH key written from raw private key secret."
          fi

          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::CPANEL_SSH_PRIVATE_KEY_B64 is not a valid SSH private key. Use the full private key, or base64 encode the private key file and save that value."
            exit 1
          fi

          if ! ssh-keyscan -T 15 -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::Could not read SSH host key from CPANEL_HOST:CPANEL_PORT. Check that SSH is enabled on cPanel and the host/port secrets are correct."
            exit 1
          fi

      - name: Create deploy archive
        shell: bash
        run: |
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".gitignore" \
            --exclude="README.md" \
            --exclude=".DS_Store" \
            -czf /tmp/theme.tar.gz .

      - name: Upload archive to server
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "${{ secrets.CPANEL_PORT }}" \
            /tmp/theme.tar.gz \
            "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}:~/theme.tar.gz"

      - name: Deploy archive on cPanel
        shell: bash
        env:
          TARGET_DIR: ${{ secrets.CPANEL_TARGET_DIR }}
        run: |
          [ -n "$TARGET_DIR" ] || { echo "CPANEL_TARGET_DIR is empty"; exit 1; }

          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "${{ secrets.CPANEL_PORT }}" \
            "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}" \
            bash -s -- "$TARGET_DIR" <<'EOF'
          set -e
          TARGET_DIR="$1"
          mkdir -p "$TARGET_DIR"
          find "$TARGET_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf ~/theme.tar.gz -C "$TARGET_DIR"
          rm -f ~/theme.tar.gz
          EOF

      - name: Deployment finished
        run: echo "Theme deployed successfully."
